<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>商单自荐邮件模板 · 阿超自媒体工具台</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />

    <!-- 工作台共享样式 -->
    <link
      rel="stylesheet"
      href="../assets/css/common.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Helvetica Neue"', 'sans-serif'],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-700 dark:bg-slate-900 dark:text-slate-200">
    <!-- 工作台顶部导航 -->
    <header
      class="sticky top-0 z-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200/60 dark:border-slate-700/60"
    >
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-12 flex items-center justify-center gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <a
            href="../index.html"
            class="shrink-0 inline-flex items-center gap-1 text-sm text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 19l-7-7 7-7"
              />
            </svg>
            <span>返回工作台</span>
          </a>
          <span class="text-slate-300 dark:text-slate-600">/</span>
          <h1 class="text-sm font-medium text-slate-900 dark:text-slate-50 truncate">商单自荐邮件模板</h1>
        </div>

        <button
          data-theme-toggle
          aria-label="切换暗色模式"
          class="theme-toggle-icon shrink-0 rounded-lg p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400"
          title="切换主题"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 hidden dark:block"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm5.657 2.343a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM18 9a1 1 0 110 2h-1a1 1 0 110-2h1zM4 9a1 1 0 010 2H-3a1 1 0 010-2h1zm1.343-5.657a1 1 0 011.414 0l.707.707a1 1 0 11-1.414 1.414l-.707-.707a1 1 0 010-1.414zM10 6a4 4 0 100 8 4 4 0 000-8z"
            />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 block dark:hidden"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
      <!-- ============ 模式切换 ============ -->
      <div
        role="tablist"
        class="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1 border border-slate-200 dark:border-slate-700"
      >
        <button
          data-mode="generate"
          role="tab"
          aria-selected="true"
          class="mode-tab px-4 py-1.5 rounded-lg text-sm font-medium transition bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 shadow-sm"
        >
          生成邮件
        </button>
        <button
          data-mode="edit"
          role="tab"
          aria-selected="false"
          class="mode-tab px-4 py-1.5 rounded-lg text-sm font-medium transition text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200"
        >
          编辑模板
        </button>
      </div>

      <!-- ============ 模式 A：编辑模板 ============ -->
      <section
        id="panel-edit"
        class="panel rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm border border-slate-200/60 dark:border-slate-700/60 space-y-4 hidden"
      >
        <div class="flex items-start justify-between gap-3">
          <div>
            <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-50">编辑模板</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
              用
              <code
                class="font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-900 text-sky-600 dark:text-sky-300"
                >{{占位符}}</code
              >
              标记将来要被替换的产品名。例如：
              <code class="font-mono text-slate-600 dark:text-slate-300">商务合作 × {{豆包}}</code>
              。
            </p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"> 标题模板 </label>
          <input
            id="t-subject"
            placeholder="例：【AI 自媒体博主】爱听书的程序员阿超 × {{豆包}} 合作意向"
            class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
          ></input>
          <p class="mt-1 text-xs text-slate-400 dark:text-slate-500">
            检测到
            <span
              id="t-count-subject"
              class="font-medium text-sky-600 dark:text-sky-300"
              >0</span
            >
            个占位符
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"> 内容模板 </label>
          <textarea
            id="t-body"
            rows="25"
            placeholder="例：您好：&#10;&#10;我是阿超，专注...&#10;&#10;期待与 {{豆包}} 合作！"
            class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-sky-500"
          ></textarea>
          <p class="mt-1 text-xs text-slate-400 dark:text-slate-500">
            检测到
            <span
              id="t-count-body"
              class="font-medium text-sky-600 dark:text-sky-300"
              >0</span
            >
            个占位符
          </p>
        </div>

        <div class="flex items-center justify-between gap-2">
          <span
            id="tpl-status"
            class="text-xs text-slate-500 dark:text-slate-400 min-h-[1rem]"
          ></span>
          <div class="flex items-center gap-2">
            <button
              id="btn-tpl-save"
              class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium transition"
            >
              💾 保存模板
            </button>
            <button
              id="btn-tpl-clear"
              class="px-4 py-2 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 text-sm font-medium transition"
            >
              清空
            </button>
          </div>
        </div>
      </section>

      <!-- ============ 模式 B：生成邮件 ============ -->
      <section
        id="panel-generate"
        class="panel rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm border border-slate-200/60 dark:border-slate-700/60 space-y-5"
      >
        <div>
          <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-50">生成邮件</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            输入产品名字，实时替换模板里的
            <code class="font-mono px-1 py-0.5 rounded bg-slate-100 dark:bg-slate-900 text-sky-600 dark:text-sky-300"
              >{{占位符}}</code
            >
            。
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5"> 自荐产品名字 </label>
          <input
            id="g-product"
            type="text"
            placeholder="例：豆包"
            class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
          />
        </div>

        <!-- 实时预览（可编辑：用户可微调，标记为脱离后产品名变化不再覆盖） -->
        <div class="space-y-4 pt-2 border-t border-slate-200 dark:border-slate-700">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
              邮件标题（可编辑）
            </label>
            <input
              id="preview-subject"
              type="text"
              data-pristine="true"
              placeholder="输入产品名后这里显示最终标题"
              class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
            />
            <!-- 按钮放 textarea 下方这一行，左组 dirty 提示，右组 重置+复制 -->
            <div class="mt-2 flex items-center justify-between gap-2 min-h-[2rem]">
              <span
                data-dirty-hint-for="subject"
                class="hidden text-xs text-amber-600 dark:text-amber-400"
                >✋ 你修改过这里，再改产品名将不会覆盖。点 ↺ 重置可重新生成。</span
              >
              <div class="flex items-center gap-2 ml-auto">
                <button
                  id="btn-reset-subject"
                  title="用当前模板 + 产品名重新生成"
                  class="hidden px-3 py-1.5 rounded-lg bg-amber-200 hover:bg-amber-300 border border-amber-300 hover:border-amber-400 dark:bg-amber-900/60 dark:hover:bg-amber-900/80 dark:border-amber-700 dark:hover:border-amber-600 text-amber-800 dark:text-amber-200 text-xs font-medium transition"
                >
                  ↺ 重置
                </button>
                <button
                  data-copy="preview-subject"
                  data-copy-label="subject"
                  class="copy-btn px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition shadow-sm"
                >
                  📋 复制邮件标题
                </button>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
              邮件内容（可编辑）
            </label>
            <textarea
              id="preview-body"
              data-pristine="true"
              placeholder="输入产品名后这里显示最终正文"
              style="height: 32rem"
              class="preview-body w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-sky-500 resize-none"
            ></textarea>
            <!-- 按钮放 textarea 下方这一行，左组 dirty 提示，右组 重置+复制 -->
            <div class="mt-2 flex items-center justify-between gap-2 min-h-[2rem]">
              <span
                data-dirty-hint-for="body"
                class="hidden text-xs text-amber-600 dark:text-amber-400"
                >✋ 你修改过这里，再改产品名将不会覆盖。点 ↺ 重置可重新生成。</span
              >
              <div class="flex items-center gap-2 ml-auto">
                <button
                  id="btn-reset-body"
                  title="用当前模板 + 产品名重新生成"
                  class="hidden px-3 py-1.5 rounded-lg bg-amber-200 hover:bg-amber-300 border border-amber-300 hover:border-amber-400 dark:bg-amber-900/60 dark:hover:bg-amber-900/80 dark:border-amber-700 dark:hover:border-amber-600 text-amber-800 dark:text-amber-200 text-xs font-medium transition"
                >
                  ↺ 重置
                </button>
                <button
                  data-copy="preview-body"
                  data-copy-label="body"
                  class="copy-btn px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition shadow-sm"
                >
                  📋 复制邮件内容
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 未设置模板的提示 -->

        <!-- 未设置模板的提示 -->
        <div
          id="no-template-hint"
          class="hidden text-sm text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 rounded-xl px-4 py-3"
        >
          ⚠️ 你还没有设置模板。先切到「编辑模板」填好模板再回来。
        </div>
      </section>
    </main>

    <!-- ============ 浮动 Toast 弹窗 ============ -->
    <div
      id="gen-toast"
      role="status"
      aria-live="polite"
      class="fixed top-8 left-1/2 -translate-x-1/2 -translate-y-4 px-6 py-3 rounded-full bg-slate-900/85 dark:bg-slate-100/90 text-white dark:text-slate-900 text-sm font-medium shadow-2xl backdrop-blur-md border border-emerald-400/40 opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2"
    ></div>

    <style>
      /* Toast 弹出动画（Tailwind CDN 不支持 group-data 复合状态，这里用原生 CSS 补充） */
      #gen-toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* 邮件正文 textarea：固定高度，内容超出时显示内部滚动条 */
      .preview-body {
        resize: none;
      }
    </style>

    <script src="../assets/js/common.js"></script>
    <script>
      (function () {
        'use strict';

        const $ = (id) => document.getElementById(id);

        // ---------- 元素 ----------
        const modeTabs = document.querySelectorAll('.mode-tab');
        const panelEdit = $('panel-edit');
        const panelGen = $('panel-generate');

        const tSubject = $('t-subject');
        const tBody = $('t-body');
        const tCountS = $('t-count-subject');
        const tCountB = $('t-count-body');
        const tplStatus = $('tpl-status');

        const gProduct = $('g-product');
        const previewS = $('preview-subject');
        const previewB = $('preview-body');
        const genToast = $('gen-toast');
        const noTplHint = $('no-template-hint');

        const STORAGE_KEY = 'smd.emailTemplates.v2';

        // ---------- 占位符替换 ----------
        // {{任意内容}} → 原位替换为 productName（productName 可长可短、与占位符内容无关）
        const PLACEHOLDER_RE = /\{\{([^{}]*?)\}\}/g;

        function countPlaceholders(text) {
          const m = text.match(PLACEHOLDER_RE);
          return m ? m.length : 0;
        }

        function replacePlaceholders(text, productName) {
          if (!productName) return text; // 没填产品名时不替换
          return text.replace(PLACEHOLDER_RE, productName);
        }

        // ---------- 存储 ----------
        function readTemplate() {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
          } catch (_) {
            return null;
          }
        }
        function writeTemplate(data) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            return true;
          } catch (e) {
            return false;
          }
        }

        // ---------- 模式切换 ----------
        function setMode(mode) {
          modeTabs.forEach((tab) => {
            const active = tab.getAttribute('data-mode') === mode;
            tab.setAttribute('aria-selected', active ? 'true' : 'false');
            tab.className =
              'mode-tab px-4 py-1.5 rounded-lg text-sm font-medium transition ' +
              (active
                ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 shadow-sm'
                : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200');
          });
          panelEdit.classList.toggle('hidden', mode !== 'edit');
          panelGen.classList.toggle('hidden', mode !== 'generate');

          // 切到「生成邮件」时，重置两个预览区为 pristine（因为模板可能刚改过）
          if (mode === 'generate') {
            setDirty(previewS, false);
            setDirty(previewB, false);
            updatePreview();
          }
        }
        modeTabs.forEach((tab) => {
          tab.addEventListener('click', () => setMode(tab.getAttribute('data-mode')));
        });

        // ---------- 编辑模板 ----------
        function loadIntoEditor() {
          const tpl = readTemplate();
          tSubject.value = tpl?.subject || '';
          tBody.value = tpl?.body || '';
          updatePlaceholderCounts();
        }

        function updatePlaceholderCounts() {
          tCountS.textContent = countPlaceholders(tSubject.value);
          tCountB.textContent = countPlaceholders(tBody.value);
        }

        tSubject.addEventListener('input', updatePlaceholderCounts);
        tBody.addEventListener('input', updatePlaceholderCounts);

        function showTplStatus(msg, isError) {
          tplStatus.textContent = msg;
          tplStatus.className =
            'text-xs min-h-[1rem] ml-2 ' +
            (isError ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400');
        }

        $('btn-tpl-save').addEventListener('click', () => {
          const subject = tSubject.value;
          const body = tBody.value;
          if (!subject.trim() && !body.trim()) {
            showTplStatus('⚠️ 模板为空，先填一些再保存', true);
            return;
          }
          const ok = writeTemplate({
            subject,
            body,
            updatedAt: Date.now(),
          });
          if (ok) showTplStatus('✅ 模板已保存');
          else showTplStatus('❌ 保存失败', true);
        });

        $('btn-tpl-clear').addEventListener('click', () => {
          if (!confirm('确定要清空当前模板吗？')) return;
          tSubject.value = '';
          tBody.value = '';
          localStorage.removeItem(STORAGE_KEY);
          updatePlaceholderCounts();
          showTplStatus('已清空');
        });

        // ---------- 生成邮件 ----------
        // 根据 dirty 状态决定是否覆盖；只覆盖未脱离（pristine）的字段
        function applyTemplateToPreviews(tpl, product) {
          const renderedSubject = product ? replacePlaceholders(tpl.subject || '', product) : tpl.subject || '';
          const renderedBody = product ? replacePlaceholders(tpl.body || '', product) : tpl.body || '';

          if (previewS.getAttribute('data-pristine') === 'true') {
            previewS.value = renderedSubject;
          }
          if (previewB.getAttribute('data-pristine') === 'true') {
            previewB.value = renderedBody;
          }
        }

        function setDirty(textarea, dirty) {
          textarea.setAttribute('data-pristine', dirty ? 'false' : 'true');
          const which = textarea === previewS ? 'subject' : 'body';
          const hint = document.querySelector(`[data-dirty-hint-for="${which}"]`);
          const btn = $(`btn-reset-${which}`);
          if (hint) hint.classList.toggle('hidden', !dirty);
          if (btn) btn.classList.toggle('hidden', !dirty);
        }

        function updatePreview() {
          const tpl = readTemplate();
          if (!tpl || (!tpl.subject && !tpl.body)) {
            noTplHint.classList.remove('hidden');
            previewS.value = '';
            previewB.value = '';
            return;
          }
          noTplHint.classList.add('hidden');
          applyTemplateToPreviews(tpl, gProduct.value);
        }

        // 文本框输入 → 标记为已脱离（除非值恰好和模板生成结果一致——避免选中再退格被误标记）
        function markDirtyIfChanged(textarea) {
          const tpl = readTemplate();
          if (!tpl) return;
          const which = textarea === previewS ? 'subject' : 'body';
          const tmplText = which === 'subject' ? tpl.subject || '' : tpl.body || '';
          const rendered = gProduct.value ? replacePlaceholders(tmplText, gProduct.value) : tmplText;
          // 实际值 vs 模板应生成值，不一致则 dirty
          setDirty(textarea, textarea.value !== rendered);
        }

        previewS.addEventListener('input', () => markDirtyIfChanged(previewS));
        previewB.addEventListener('input', () => markDirtyIfChanged(previewB));

        // 重置按钮：清掉 dirty，按当前模板 + 产品名重新生成
        function resetField(textarea) {
          setDirty(textarea, false);
          updatePreview();
          textarea.focus();
        }
        $('btn-reset-subject').addEventListener('click', () => resetField(previewS));
        $('btn-reset-body').addEventListener('click', () => resetField(previewB));

        gProduct.addEventListener('input', updatePreview);

        // ---------- 复制 ----------
        async function copyText(text) {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
              return true;
            }
          } catch (_) {
            /* fallback */
          }
          // Fallback: 隐藏 textarea + execCommand
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand('copy');
          } catch (_) {}
          document.body.removeChild(ta);
          return ok;
        }

        document.querySelectorAll('.copy-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const targetId = btn.getAttribute('data-copy');
            const label = btn.getAttribute('data-copy-label') || '内容';
            const el = $(targetId);
            // 兼容 input / textarea（用 .value）和普通元素（用 .textContent）
            const text = ('value' in el) ? el.value : el.textContent;
            if (!text.trim()) {
              showGenStatus('⚠️ 没有可复制的内容', true);
              return;
            }
            const ok = await copyText(text);
            showGenStatus(
              ok ? `✅ 邮件${label === 'subject' ? '标题' : '内容'}复制成功` : '❌ 复制失败，请手动选择',
              !ok,
            );
          });
        });

        function showGenStatus(msg, isError) {
          // 错误用玫瑰色边框，成功用 emerald 边框（已在 HTML 上预设 emerald）
          genToast.textContent = msg;
          if (isError) {
            genToast.classList.remove('border-emerald-400/40');
            genToast.classList.add('border-rose-400/60');
          } else {
            genToast.classList.remove('border-rose-400/60');
            genToast.classList.add('border-emerald-400/40');
          }
          // 触发淡入 + 上滑
          genToast.classList.add('show');
          // 2.5s 后自动消失
          clearTimeout(showGenStatus._t);
          showGenStatus._t = setTimeout(() => {
            genToast.classList.remove('show');
            // 动画结束后再清空文本（避免动画过程中闪烁）
            setTimeout(() => {
              genToast.textContent = '';
            }, 300);
          }, 2500);
        }

        // ---------- 初始化 ----------
        loadIntoEditor();
        updatePreview();
        setMode('generate'); // 默认进入「生成邮件」模式
      })();
    </script>
  </body>
</html>
